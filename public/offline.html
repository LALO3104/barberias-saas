<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0b" />
    <title>Sin conexión — Mi barbería</title>
    <style>
      /* Página estática: los colores son los valores de src/styles/tokens.css. */
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; }
      body {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(24px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px));
        box-sizing: border-box;
        background: #0b0b0b;
        color: #f5f5f5;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-tap-highlight-color: transparent;
        text-align: center;
      }
      main { max-width: 22rem; }
      img { width: 64px; height: 64px; border-radius: 16px; }
      h1 { margin: 20px 0 8px; font-family: Georgia, serif; font-weight: 400; font-size: 1.5rem; }
      p { margin: 0; color: #a8a8a8; line-height: 1.6; }
      button {
        margin-top: 28px;
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 10px;
        background: #c6a15b;
        color: #0b0b0b;
        font: inherit;
        font-weight: 600;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        transition: transform 150ms cubic-bezier(0.23, 1, 0.32, 1);
      }
      button:active { transform: scale(0.97); }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa/icon/192" alt="" />
      <h1>Sin conexión</h1>
      <p>Revisa tu internet. Tus citas y horarios aparecerán en cuanto vuelva la conexión.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
